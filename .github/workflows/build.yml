name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java JDK
      uses: actions/setup-java@v5   # FIX: Updated to v5 to remove Java deprecation warning
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      # FIX: Removed libgstreamer1.0-dev to solve Exit Code 100 (Dependency Hell)
      # Added cmake, autoconf, libtool which Kivy needs for clean compilation
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache git libffi-dev libssl-dev python3-dev zip unzip zlib1g-dev build-essential autoconf automake libtool pkg-config cmake

    - name: Install Buildozer & Cython
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install "Cython==0.29.33"
        pip install buildozer

    - name: Build APK with Buildozer
      env:
        CI: 1
      run: |
        yes | buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RoyalChess-APK
        path: bin/*.apk


