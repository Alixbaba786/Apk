name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk \
            python3-dev autoconf libtool pkg-config \
            libffi-dev libssl-dev libsqlite3-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            ccache wget curl
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Setup Android SDK/NDK
        run: |
          mkdir -p $HOME/.buildozer
          echo "android_api = 33" >> ~/.buildozer/buildozer.ini
          echo "android_minapi = 21" >> ~/.buildozer/buildozer.ini
          echo "android_ndk = 25b" >> ~/.buildozer/buildozer.ini

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install Cython==0.29.35 buildozer pyjnius kivy

      - name: Build APK
        run: |
          # Agar buildozer.spec hai to use karo, nahi to error handle karo
          if [ ! -f buildozer.spec ]; then
            echo "buildozer.spec nahi milya! Tumhain ye file add karni padegi."
            exit 1
          fi
          yes | buildozer -v android debug 2>&1 | tail -50
        continue-on-error: false

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PK786-Casino-APK
          path: bin/*.apk
          retention-days: 30

      - name: Show Build Status
        run: |
          if [ -f bin/*.apk ]; then
            echo "✅ APK Successfully Built!"
            ls -lh bin/*.apk
          else
            echo "❌ APK Build Failed"
            exit 1
          fi

