name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04   # FIX 1: Ubuntu 24.04 causes Buildozer to crash

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'  # FIX 2: Python 3.10 is perfectly stable for Android NDK

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache git libffi-dev libssl-dev python3-dev zip unzip zlib1g-dev build-essential libltdl-dev libgstreamer1.0-dev openjdk-17-jdk

    - name: Install Buildozer & Cython
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install "Cython==0.29.33"  # FIX 3: Required version for Kivy
        pip install buildozer

    - name: Build APK with Buildozer
      env:
        CI: 1  # FIX 4: Tells Buildozer it's running on a server, preventing input crashes
      run: |
        yes | buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RoyalChess-APK
        path: bin/*.apk

