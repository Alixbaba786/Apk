name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Fixes Node.js warnings by explicitly using Node24 environment
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (Fix Exit Code 100)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev \
            zlib1g-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev \
            libreadline-dev libffi-dev libgl1-mesa-dev libgles2-mesa-dev ccache git \
            ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixin-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            openjdk-17-jdk unzip zip autoconf libtool pkg-config
          sudo apt-get clean
          rm -rf /var/lib/apt/lists/*

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip setuptools
          pip install Cython==0.29.36 buildozer

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PK786-Casino-APK
          path: bin/*.apk

