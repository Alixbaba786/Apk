name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip \
            openjdk-17-jdk openjdk-17-jdk-headless \
            python3-dev python3-venv \
            autoconf automake libtool libtoolize m4 \
            pkg-config libffi-dev libssl-dev \
            libsqlite3-dev sqlite3 libbz2-dev zlib1g-dev \
            libreadline-dev libgdbm-dev libgdbm-compat-dev liblzma-dev \
            libncurses5-dev libncursesw5-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            ccache wget curl git-core
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Setup Java Home
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Upgrade pip and install Python tools
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install cython==0.29.35 buildozer

      - name: Build APK
        run: |
          echo "Starting APK build..."
          yes | buildozer -v android debug
          
      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PK786-Casino-APK
          path: bin/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Build Status
        if: always()
        run: |
          if [ -f bin/*.apk ]; then
            echo "✅ APK BUILD SUCCESS!"
            ls -lh bin/*.apk
          else
            echo "❌ APK build failed"
            exit 1
          fi

