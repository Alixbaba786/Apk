name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4.2.2

    - name: Set up Python
      uses: actions/setup-python@v5.4.0
      with:
        python-version: '3.11'

    - name: Set up Java JDK
      uses: actions/setup-java@v5.0.0
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache git libffi-dev libssl-dev python3-dev zip unzip zlib1g-dev build-essential libltdl-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good autoconf automake libtool pkg-config

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install "cython<3.0.0"
        pip install buildozer

    - name: Execute Buildozer Build
      run: |
        yes | buildozer android debug

    - name: Upload Compiled APK
      uses: actions/upload-artifact@v4.6.1
      with:
        name: RoyalChess-APK
        path: bin/*.apk
